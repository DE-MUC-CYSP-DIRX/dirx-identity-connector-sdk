name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and verify the template (Gradle)
        run: ./gradlew build verifyTemplate --console=plain
      - name: Verify the template (Maven)
        run: mvn -B -f template/pom.xml verify "-Dconnector.sdk.repository=file://$GITHUB_WORKSPACE/build/staging-repo"
